<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { width: 300px; padding: 16px; background: #fff; }
    h1 { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: #111; }
    label { font-size: 12px; color: #555; display: block; margin-bottom: 4px; margin-top: 10px; }
    input[type="password"] {
      width: 100%; padding: 8px 10px; border: 1px solid #ddd;
      border-radius: 6px; font-size: 13px; outline: none;
    }
    input[type="password"]:focus { border-color: #6366f1; }
    hr { border: none; border-top: 1px solid #eee; margin: 14px 0 4px; }
    button {
      margin-top: 12px; width: 100%; padding: 8px;
      background: #6366f1; color: #fff; border: none;
      border-radius: 6px; font-size: 13px; cursor: pointer;
    }
    button:hover { background: #4f46e5; }
    #status { margin-top: 8px; font-size: 12px; text-align: center; color: #16a34a; min-height: 16px; }
    .hint { margin-top: 12px; font-size: 11px; color: #999; line-height: 1.4; }
    .hint-gemini { margin-top: 6px; font-size: 11px; color: #999; line-height: 1.4; }
    a { color: #6366f1; text-decoration: none; }
    .version { margin-top: 12px; font-size: 11px; color: #bbb; text-align: right; }
  </style>
</head>
<body>
  <h1>🎤 Voice Input — Casier Frais</h1>

  <label for="apiKey">Clé API ElevenLabs</label>
  <input type="password" id="apiKey" placeholder="sk_..." autocomplete="off" />
  <p class="hint">Récupère ta clé sur <a href="https://elevenlabs.io/app/settings/api-keys" target="_blank">elevenlabs.io</a>.</p>

  <hr/>

  <label for="geminiKey">Clé API Gemini <span style="color:#999">(fallback parsing)</span></label>
  <input type="password" id="geminiKey" placeholder="AIza..." autocomplete="off" />
  <p class="hint-gemini">Utilisée uniquement quand le parser local échoue. Récupère ta clé sur <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com</a>.</p>

  <button id="save">Enregistrer</button>
  <div id="status"></div>

  <div class="version" id="version"></div>
  <script src="popup.js"></script>
</body>
</html>
